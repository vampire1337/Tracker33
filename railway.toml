[build]
builder = "nixpacks"

[deploy]
startCommand = "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn Tracker33.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
healthcheckPath = "/api/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[environments.production.variables]
DEBUG = "False"
DJANGO_SETTINGS_MODULE = "Tracker33.settings"
