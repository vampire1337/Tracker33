version: '3.8'

services:
  web:
    build: .
    container_name: tracker33_web
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
      - ./media:/app/media
      - ./db.sqlite3:/app/db.sqlite3
    environment:
      - DEBUG=False
      - SECRET_KEY=your-production-secret-key-change-this
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:8001,http://127.0.0.1:8001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - db
    networks:
      - tracker33_network

  db:
    image: postgres:15-alpine
    container_name: tracker33_db
    environment:
      - POSTGRES_DB=tracker33
      - POSTGRES_USER=tracker33
      - POSTGRES_PASSWORD=secure_password_change_this
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - tracker33_network

  nginx:
    image: nginx:alpine
    container_name: tracker33_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./ssl:/etc/nginx/ssl  # Для SSL сертификатов
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - tracker33_network

  redis:
    image: redis:7-alpine
    container_name: tracker33_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - tracker33_network

volumes:
  postgres_data:
  redis_data:

networks:
  tracker33_network:
    driver: bridge
