[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:tracker33]
command=/home/tracker33/tracker33/.venv/bin/gunicorn --config /etc/tracker33/gunicorn.conf.py Tracker33.wsgi:application
directory=/home/tracker33/tracker33
user=tracker33
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/tracker33/gunicorn.log
environment=
    DJANGO_SETTINGS_MODULE=Tracker33.settings,
    PATH="/home/tracker33/tracker33/.venv/bin:%(ENV_PATH)s"